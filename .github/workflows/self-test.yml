name: Self test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: upgradecheck
        uses: ./
        with:
          path: test/retired-workflow.json
          fail-on: none
      - name: Verify retired model was detected
        shell: bash
        run: |
          test "${{ steps.upgradecheck.outputs.retired-count }}" = "1"
          test "${{ steps.upgradecheck.outputs.issue-count }}" = "1"
